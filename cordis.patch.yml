# ============================================================================
# dsh-live2d-widget —— DSH bundle patch
# ============================================================================
# 插件的"挂载声明"：DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把
# Live2D 桌宠挂件插入 Web profile 的配置树。
#
# 安装方式：
#   dsh plugin --profile web add dsh-live2d-widget
# 本地开发安装（本目录）：
#   dsh plugin --profile web add link:D:\Plugins\dsh-live2d-widget
# ============================================================================

- insert:
    - id: dsh-live2d-widget
      name: dsh-live2d-widget
